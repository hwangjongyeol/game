openapi: 3.0.3
info:
  title: AutoGame API
  version: 1.0.0
  description: AutoGame backend API specification (Spring Boot)
servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Player
  - name: Economy
  - name: Reward
  - name: Ranking
  - name: Item
  - name: Character
  - name: DailyQuest
  - name: Dungeon
  - name: Admin
  - name: Balance

paths:
  /api/v1/players:
    post:
      tags: [Player]
      summary: Create player
      operationId: createPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePlayer'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Player]
      summary: Get players
      operationId: getPlayers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePlayerList'

  /api/v1/players/{id}:
    get:
      tags: [Player]
      summary: Get player by id
      operationId: getPlayer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePlayer'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/wallets/{userId}:
    get:
      tags: [Economy]
      summary: Get wallet
      operationId: getWallet
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWallet'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/economy/earn:
    post:
      tags: [Economy]
      summary: Earn currency
      operationId: earnCurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EarnCurrencyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWallet'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/economy/spend:
    post:
      tags: [Economy]
      summary: Spend currency
      operationId: spendCurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendCurrencyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWallet'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/rewards/offline/claim:
    post:
      tags: [Reward]
      summary: Claim offline reward
      operationId: claimOfflineReward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineRewardClaimRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfflineRewardClaim'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/rankings:
    get:
      tags: [Ranking]
      summary: Get top rankings
      operationId: getRankings
      parameters:
        - name: seasonId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRankingEntryList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/rankings/me:
    get:
      tags: [Ranking]
      summary: Get my ranking
      operationId: getMyRanking
      parameters:
        - name: seasonId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMyRanking'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/rankings/score:
    post:
      tags: [Ranking]
      summary: Update ranking score
      operationId: addRankingScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRankingScoreRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMyRanking'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/loot:
    post:
      tags: [Item]
      summary: Save loot items
      operationId: saveLootItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LootItemsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserItemList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/{userId}:
    get:
      tags: [Item]
      summary: Get user inventory
      operationId: getUserItems
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserItemList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/catalog:
    get:
      tags: [Item]
      summary: Get active item catalog
      operationId: getItemCatalog
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseItemMasterList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/catalog/{itemId}:
    get:
      tags: [Item]
      summary: Get item master by itemId
      operationId: getItemMaster
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseItemMaster'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/drop-table/{monsterId}:
    get:
      tags: [Item]
      summary: Get monster drop table
      operationId: getMonsterDropTable
      parameters:
        - name: monsterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMonsterDropList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/consume:
    post:
      tags: [Item]
      summary: Consume item
      operationId: consumeItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeItemRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserItemList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/equipment/{userId}:
    get:
      tags: [Item]
      summary: Get user equipment
      operationId: getUserEquipment
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserEquipment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/equipment:
    post:
      tags: [Item]
      summary: Update user equipment
      operationId: updateUserEquipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserEquipment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/upgrade:
    post:
      tags: [Item]
      summary: Upgrade equipment item
      operationId: upgradeItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeItemRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserItem'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/equipment/presets/{userId}:
    get:
      tags: [Item]
      summary: Get equipment presets
      operationId: getEquipmentPresets
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserEquipmentPresetList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/equipment/presets:
    post:
      tags: [Item]
      summary: Save current equipment as preset
      operationId: saveEquipmentPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEquipmentPresetRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserEquipmentPreset'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/items/equipment/presets/apply:
    post:
      tags: [Item]
      summary: Apply equipment preset
      operationId: applyEquipmentPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyEquipmentPresetRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserEquipment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/characters/{userId}:
    get:
      tags: [Character]
      summary: Get character stats
      operationId: getCharacterStats
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCharacterStat'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/characters/upgrade:
    post:
      tags: [Character]
      summary: Upgrade character stat
      operationId: upgradeCharacterStat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeCharacterStatRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCharacterStat'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/daily-quests/{userId}:
    get:
      tags: [DailyQuest]
      summary: Get daily quest status
      operationId: getDailyQuestStatus
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDailyQuestStatus'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/daily-quests/progress:
    post:
      tags: [DailyQuest]
      summary: Add daily quest progress
      operationId: addDailyQuestProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyQuestProgressRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDailyQuestStatus'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/daily-quests/claim:
    post:
      tags: [DailyQuest]
      summary: Claim daily quest reward
      operationId: claimDailyQuestReward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyQuestClaimRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDailyQuestStatus'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/dungeons/{dungeonId}/progress/{userId}:
    get:
      tags: [Dungeon]
      summary: Get dungeon progress
      operationId: getDungeonProgress
      parameters:
        - name: dungeonId
          in: path
          required: true
          schema:
            type: string
            example: dungeon1
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDungeonProgress'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/dungeons/{dungeonId}/progress:
    post:
      tags: [Dungeon]
      summary: Update dungeon progress
      operationId: updateDungeonProgress
      parameters:
        - name: dungeonId
          in: path
          required: true
          schema:
            type: string
            example: dungeon1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDungeonProgressRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDungeonProgress'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/balance/runtime:
    get:
      tags: [Balance]
      summary: Get active runtime balance profile JSON
      operationId: getRuntimeBalanceProfile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/admin/balance-profiles:
    get:
      tags: [Admin]
      summary: Get balance profiles
      operationId: getBalanceProfiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObjectList'
    post:
      tags: [Admin]
      summary: Create balance profile
      operationId: createBalanceProfile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'

  /api/v1/admin/balance-profiles/{profileId}:
    put:
      tags: [Admin]
      summary: Update balance profile
      operationId: updateBalanceProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
    delete:
      tags: [Admin]
      summary: Delete balance profile
      operationId: deleteBalanceProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/v1/classes:
    get:
      tags: [Balance]
      summary: Get active class masters
      operationId: getClassMastersPublic
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObjectList'

  /api/v1/admin/classes:
    get:
      tags: [Admin]
      summary: Get class masters
      operationId: getClassMastersAdmin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObjectList'
    post:
      tags: [Admin]
      summary: Create class master
      operationId: createClassMaster
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'

  /api/v1/admin/classes/{classId}:
    put:
      tags: [Admin]
      summary: Update class master
      operationId: updateClassMaster
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
    delete:
      tags: [Admin]
      summary: Delete class master (deactivate)
      operationId: deleteClassMaster
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/v1/admin/items/{itemId}/upgrade-tiers:
    get:
      tags: [Admin]
      summary: Get item upgrade tiers
      operationId: getItemUpgradeTiers
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObjectList'

  /api/v1/admin/item-upgrade-tiers:
    post:
      tags: [Admin]
      summary: Create item upgrade tier
      operationId: createItemUpgradeTier
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'

  /api/v1/admin/item-upgrade-tiers/{tierId}:
    put:
      tags: [Admin]
      summary: Update item upgrade tier
      operationId: updateItemUpgradeTier
      parameters:
        - name: tierId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
    delete:
      tags: [Admin]
      summary: Delete item upgrade tier
      operationId: deleteItemUpgradeTier
      parameters:
        - name: tierId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

components:
  responses:
    BadRequest:
      description: Validation or business rule error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: userId must not be null
      required: [code, message]

    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
      required: [success, data, error]

    ApiResponseObject:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
        error:
          nullable: true
          $ref: '#/components/schemas/ApiError'
      required: [success, data, error]

    ApiResponseObjectList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        error:
          nullable: true
          $ref: '#/components/schemas/ApiError'
      required: [success, data, error]

    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        data:
          nullable: true
        error:
          nullable: true
          $ref: '#/components/schemas/ApiError'
      required: [success, data, error]

    CreatePlayerRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 20
      required: [nickname]

    PlayerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        level:
          type: integer
          format: int64
        gold:
          type: integer
          format: int64
      required: [id, nickname, level, gold]

    WalletResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        gold:
          type: integer
          format: int64
        gem:
          type: integer
          format: int64
        energy:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
      required: [userId, gold, gem, energy, updatedAt]

    CurrencyType:
      type: string
      enum: [GOLD, GEM, ENERGY]

    EarnCurrencyRequest:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        currencyType:
          $ref: '#/components/schemas/CurrencyType'
        amount:
          type: integer
          format: int64
          minimum: 1
        reasonCode:
          type: string
        referenceId:
          type: string
          nullable: true
      required: [userId, currencyType, amount, reasonCode]

    SpendCurrencyRequest:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        currencyType:
          $ref: '#/components/schemas/CurrencyType'
        amount:
          type: integer
          format: int64
          minimum: 1
        reasonCode:
          type: string
        referenceId:
          type: string
          nullable: true
      required: [userId, currencyType, amount, reasonCode]

    OfflineRewardClaimRequest:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        clientLastSeenAt:
          type: string
          format: date-time
      required: [userId, clientLastSeenAt]

    OfflineRewardClaimResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        offlineSeconds:
          type: integer
          format: int64
        goldReward:
          type: integer
          format: int64
        expReward:
          type: integer
          format: int64
        capped:
          type: boolean
      required: [userId, offlineSeconds, goldReward, expReward, capped]

    RankingEntryResponse:
      type: object
      properties:
        rank:
          type: integer
          format: int32
        userId:
          type: integer
          format: int64
        score:
          type: integer
          format: int64
      required: [rank, userId, score]

    MyRankingResponse:
      type: object
      properties:
        seasonId:
          type: string
        userId:
          type: integer
          format: int64
        rank:
          type: integer
          format: int32
        score:
          type: integer
          format: int64
      required: [seasonId, userId, rank, score]

    UpdateRankingScoreRequest:
      type: object
      properties:
        seasonId:
          type: string
        userId:
          type: integer
          format: int64
        scoreDelta:
          type: integer
          format: int64
      required: [seasonId, userId, scoreDelta]

    LootItemRequest:
      type: object
      properties:
